<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link rel="stylesheet"
    href="css/style.css">

    <link rel="stylesheet"
    href="css/responsive.css">
</head>

<body>

<div class="container">

<h1>Student Activity System</h1>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<input
type="tel"
id="phone"
placeholder="Phone"
pattern="[0-9]{10}"
required>

<button>
Login
</button>

</form>

</div>

<script src="auth.js"></script>

</body>
</html>
